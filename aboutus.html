<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elegans About</title>
<link rel="stylesheet" href="style.css">
<style>
  body, html {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: sans-serif;
}

.about-section {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.about-section video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.main-title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 6vw;
  color: #fff;
  white-space: nowrap;
}

.corner-text {
  position: absolute;
  color: #fff;
  font-size: 1.5vw;
  opacity: 0;
}

.left-bottom {
  bottom: 5%;
  left: 5%;
}

.right-bottom {
  bottom: 5%;
  right: 5%;
}

.paragraphs {
  position: relative;
  width: 100%;
  height: 100%;
}

.paragraph {
  position: absolute;
  top: 50%;
  right: -100%;
  transform: translateY(-50%);
  font-size: 2vw;
  width: 40%;
  color: #fff;
  opacity: 0;
}


</style>
</head>
<body>

<section class="about-section">
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="showreel.mp4" type="video/mp4">
  </video>

  <div class="overlay">
    <h1 class="main-title">Elegans</h1>
    <div class="corner-text left-bottom">Elegans Branding Company</div>
    <div class="corner-text right-bottom">Nice to meet you</div>

    <div class="paragraphs">
      <p class="paragraph para1">We create amazing branding experiences...</p>
      <p class="paragraph para2">Our design philosophy is unique...</p>
      <p class="paragraph para3">We focus on innovation and creativity...</p>
    </div>
  </div>

  <!-- Create real scrollable space -->
<div style="height: 4000px;"></div>
</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.1/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.1/ScrollTrigger.min.js"></script>
<script src="scripst.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

// Pin the about section and create scroll-controlled animation
ScrollTrigger.create({
  trigger: ".about-section",
  start: "top top",
  end: "+=3000", // scrollable distance
  pin: true,
  scrub: 1
});

// Main title animation
gsap.to(".main-title", {
  scale: 0.5,
  x: "-40vw",
  y: "-40vh",
  scrollTrigger: {
    trigger: ".about-section",
    start: "top top",
    end: "top+=500 top",
    scrub: 1
  }
});

// Show corner texts
gsap.to(".left-bottom", { opacity: 1, scrollTrigger: { trigger: ".about-section", start: "top top", end: "top+=500 top", scrub: 1 }});
gsap.to(".right-bottom", { opacity: 1, scrollTrigger: { trigger: ".about-section", start: "top top", end: "top+=500 top", scrub: 1 }});

// Paragraphs animation
const paragraphs = gsap.utils.toArray(".paragraph");
paragraphs.forEach((p, i) => {
  gsap.fromTo(p, { x: "100vw", opacity: 0 }, { 
    x: "10vw", 
    opacity: 1,
    scrollTrigger: {
      trigger: ".about-section",
      start: () => `top+=${600 + i*800} top`,
      end: () => `top+=${1000 + i*800} top`,
      scrub: 1
    }
  });

  gsap.to(p, { x: "-120vw", opacity: 0, scrollTrigger: {
      trigger: ".about-section",
      start: () => `top+=${1000 + i*800} top`,
      end: () => `top+=${1400 + i*800} top`,
      scrub: 1
  }});
});

// Video zoom
gsap.to("#bgVideo", { scale: 1.1, scrollTrigger: { trigger: ".about-section", start: "top top", end: "bottom bottom", scrub: 1 }});


</script>

</body>
</html>
